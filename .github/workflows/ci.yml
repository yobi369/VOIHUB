name: VOI HUB CI

on:
  push:
    branches:
      - main
      - launch-prep
      - 'bmtech/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: voi-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run typecheck

      - name: Server guard tests
        run: bun run test

      - name: Production build
        run: bun run build
