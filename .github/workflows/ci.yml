name: VOI HUB CI

on:
  push:
    branches:
      - main
      - launch-prep
      - 'bmtech/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: voi-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, Firestore rules, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install temporary Firestore emulator test tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4 firebase-tools

      - name: Firestore security rules lint
        run: bun run lint

      - name: TypeScript validation
        run: bun run typecheck

      - name: Server guard tests
        run: bun run test

      - name: Firestore emulator access-control tests
        run: bun run test:rules

      - name: Production build
        run: bun run build
